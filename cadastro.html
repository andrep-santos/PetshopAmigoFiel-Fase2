<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Amigo Fiel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">🐾 Amigo Fiel</a>
            <div class="ms-auto">
                <a href="index.html" class="btn btn-outline-light">Voltar para Home</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div id="saudacao" class="alert alert-info" role="alert"></div>

        <h2 class="mb-4">Formulário de Cadastro e Agendamento</h2>
        
        <form id="formAgendamento" onsubmit="validarFormulario(event)">
            
            <div class="card mb-4">
                <div class="card-header bg-secondary text-white">Dados do Tutor (Cliente)</div>
                <div class="card-body row g-3">
                    <div class="col-md-6">
                        <label for="nome" class="form-label">Nome Completo *</label>
                        <input type="text" class="form-control" id="nome" placeholder="Seu nome" required>
                    </div>
                    <div class="col-md-6">
                        <label for="cpf" class="form-label">CPF</label>
                        <input type="text" class="form-control" id="cpf" placeholder="000.000.000-00">
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label">E-mail *</label>
                        <input type="email" class="form-control" id="email" placeholder="exemplo@email.com" required>
                    </div>
                    <div class="col-md-6">
                        <label for="telefone" class="form-label">Telefone</label>
                        <input type="tel" class="form-control" id="telefone" placeholder="(11) 99999-9999">
                    </div>
                    <div class="col-12">
                        <label for="endereco" class="form-label">Endereço Completo</label>
                        <input type="text" class="form-control" id="endereco" placeholder="Rua, número e bairro">
                    </div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header bg-secondary text-white">Dados do Pet</div>
                <div class="card-body row g-3">
                    <div class="col-md-4">
                        <label for="nomePet" class="form-label">Nome do Pet *</label>
                        <input type="text" class="form-control" id="nomePet" required>
                    </div>
                    <div class="col-md-4">
                        <label for="raca" class="form-label">Raça</label>
                        <input type="text" class="form-control" id="raca">
                    </div>
                    <div class="col-md-4">
                        <label for="idade" class="form-label">Idade (anos)</label>
                        <input type="number" class="form-control" id="idade" min="0">
                    </div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header bg-secondary text-white">Serviço e Agendamento</div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Serviços Desejados:</label><br>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="banho" value="banho">
                            <label class="form-check-label" for="banho">Banho</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="tosa" value="tosa">
                            <label class="form-check-label" for="tosa">Tosa Higiênica</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Método de Transporte:</label><br>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="transporte" id="levaTraz" value="telebusca">
                            <label class="form-check-label" for="levaTraz">Tele-busca (Buscamos em casa)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="transporte" id="local" value="local" checked>
                            <label class="form-check-label" for="local">Entrega no Local (Tutor traz o pet)</label>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <label for="dataAgendamento" class="form-label">Data e Hora *</label>
                            <input type="datetime-local" class="form-control" id="dataAgendamento" required>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mb-4 border-warning">
                <div class="card-header bg-warning text-dark fw-bold">
                    🛒 Adicionar Produtos ao Pedido (Opcional)
                </div>
                <div class="card-body">
                    <p class="text-muted small mb-3">Selecione os itens que deseja receber junto com o serviço do seu pet.</p>
                    
                    <div class="row g-3">
                        <div class="col-md-4">
                            <h6 class="text-primary border-bottom pb-1">Acessórios</h6>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="prodCama" value="75.00">
                                <label class="form-check-label" for="prodCama">Cama Aconchegante (R$ 75,00)</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="prodBola" value="25.00">
                                <label class="form-check-label" for="prodBola">Brinquedo Bola (R$ 25,00)</label>
                            </div>
                        </div>

                        <div class="col-md-4">
                            <h6 class="text-primary border-bottom pb-1">Rações</h6>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="prodRacao" value="180.00">
                                <label class="form-check-label" for="prodRacao">Ração Premium 15kg (R$ 180,00)</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="prodSache" value="45.00">
                                <label class="form-check-label" for="prodSache">Caixa Sachê Gatos (R$ 45,00)</label>
                            </div>
                        </div>

                        <div class="col-md-4">
                            <h6 class="text-primary border-bottom pb-1">Higiene</h6>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="prodTapete" value="60.00">
                                <label class="form-check-label" for="prodTapete">Tapete Higiênico (R$ 60,00)</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="prodShampoo" value="35.00">
                                <label class="form-check-label" for="prodShampoo">Shampoo Neutro (R$ 35,00)</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-success btn-lg w-100 fw-bold">Confirmar Agendamento</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
